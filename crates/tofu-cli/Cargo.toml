[package]
name = "tofu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for the TOFU lossless audio preset container"

[[bin]]
name = "tofu"
path = "src/main.rs"

[dependencies]
tofu-core = { path = "../tofu-core" }
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
indicatif = "0.17"
colored = "3.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.17"
assert_cmd = "2.0"
predicates = "3.1"
